<!doctype html><html><head><link rel="stylesheet" href="styles.css"><title>10,000 records</title></head><body><main><h1>Large dataset</h1><section id="rows"></section></main><script>const root=document.querySelector('#rows'),fragment=document.createDocumentFragment();for(let i=0;i<10000;i++){const row=document.createElement('article');row.className='row data-row';row.dataset.id=String(i);row.innerHTML='<span class="name">Record '+i+'</span><span class="value">'+(i*1.25)+'</span>';fragment.append(row)}root.append(fragment)</script></body></html>
