<!doctype html><html><head><link rel="stylesheet" href="styles.css"><title>Delayed fields</title></head><body><main><h1>Delayed inventory</h1><section id="items" class="grid"></section></main><script>const root=document.querySelector('#items');for(let i=0;i<12;i++){const card=document.createElement('article');card.className='card item';card.innerHTML='<h2 class="name">Item '+i+'</h2><span class="price"></span>';root.append(card);setTimeout(()=>card.querySelector('.price').textContent='$'+(20+i)+'.00',200+i*75)}</script></body></html>
