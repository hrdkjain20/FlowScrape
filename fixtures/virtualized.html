<!doctype html><html><head><link rel="stylesheet" href="styles.css"><title>Virtualized recycled rows</title></head><body><main><h1>Virtualized contacts</h1><p>Use the buttons to simulate scrolling while ten DOM nodes are recycled.</p><button id="back">Previous</button> <button id="next">Next</button><section id="list"></section></main><script>let start=0;const list=document.querySelector('#list');for(let i=0;i<10;i++){const row=document.createElement('article');row.className='row contact';list.append(row)}function render(){[...list.children].forEach((row,i)=>{const id=start+i;row.dataset.key=String(id);row.innerHTML='<h2 class="name">Contact '+id+'</h2><a class="email" href="mailto:person'+id+'@example.test">person'+id+'@example.test</a>'})}next.onclick=()=>{start=Math.min(990,start+10);render()};back.onclick=()=>{start=Math.max(0,start-10);render()};render()</script></body></html>
