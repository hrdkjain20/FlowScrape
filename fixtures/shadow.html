<!doctype html><html><head><link rel="stylesheet" href="styles.css"><title>Open shadow products</title></head><body><main><h1>Shadow catalog</h1><product-grid></product-grid></main><script>const host=document.querySelector('product-grid');const root=host.attachShadow({mode:'open'});root.innerHTML=`<style>.card{border:1px solid #ddd;padding:12px;margin:8px}</style><section class="products">${Array.from({length:6},(_,i)=>`<article class="card"><h2 class="name">Shadow item ${i}</h2><span class="price">$${i+4}</span></article>`).join('')}</section>`</script></body></html>
