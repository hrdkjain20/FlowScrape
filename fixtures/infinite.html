<!doctype html><html><head><link rel="stylesheet" href="styles.css"><title>Infinite feed</title></head><body><main><h1>Infinite feed</h1><section id="feed"></section><div id="sentinel">Scroll for more</div></main><script>let n=0;const feed=document.querySelector('#feed');function add(){for(let i=0;i<20;i++){const row=document.createElement('article');row.className='row';row.dataset.id=String(n);row.innerHTML='<h2 class="title">Result '+n+'</h2><a href="?id='+n+'">Open</a>';feed.append(row);n++}}add();new IntersectionObserver(e=>{if(e[0].isIntersecting&&n<200)setTimeout(add,150)}).observe(document.querySelector('#sentinel'))</script></body></html>
