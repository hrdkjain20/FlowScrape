<!doctype html><html><head><link rel="stylesheet" href="styles.css"><title>SPA results</title></head><body><main><nav><button data-page="alpha">Alpha route</button><button data-page="beta">Beta route</button></nav><h1 id="heading"></h1><section id="results"></section></main><script>function route(name){history.pushState({},'',`#${name}`);heading.textContent=name+' results';results.innerHTML=Array.from({length:8},(_,i)=>`<article class="row result" data-id="${name}-${i}"><h2 class="title">${name} ${i}</h2><a href="#${name}-${i}">Open</a></article>`).join('')}document.querySelectorAll('button').forEach(b=>b.onclick=()=>route(b.dataset.page));route('alpha')</script></body></html>
